name: Deploy site to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/build-sites-static.mjs"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}
  # Lets an external system (the Sanity "content published" webhook) request a
  # rebuild, so CMS edits reach the static site without a code push.
  repository_dispatch:
    types: [sanity-content-published]

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        run: npm install --prefix apps/web
      - name: Build static site + worker
        env:
          # Baked into the static export at build time. Without it the contact
          # form renders its "Online booking is being configured" notice with a
          # disabled submit button. See docs/BOOKING_TO_NOTION.md.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Sanity landing-page content. Project ID and dataset name are not
          # secret, so they are repository variables rather than secrets.
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          # getLandingPageContent() currently requires all three values before
          # it will query Sanity at all; without a token it serves the built-in
          # fallback content. Wired up here so that adding the secret is
          # sufficient, but see the PR description for the alternative.
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: npm run sites:build
      # Reports what actually got baked into the artifact about to be uploaded.
      # The contact form silently shipped disabled for three weeks because
      # nothing surfaced it; this makes that visible in the deploy log.
      # Report-only: it never fails the build.
      - name: Verify build output
        run: |
          set -uo pipefail
          contact=dist/client/contact.html
          home=dist/client/index.html
          echo "== Contact form =="
          if grep -q "Online booking is being configured" "$contact"; then
            echo "  Turnstile:  NOT configured - booking form is DISABLED"
          else
            echo "  Turnstile:  configured"
          fi
          if grep -q 'class="cf-turnstile"' "$contact"; then
            echo "  Widget:     present"
          else
            echo "  Widget:     absent"
          fi
          # Must match the submit button itself: a disabled <option> in the
          # company-size select also contains disabled="".
          if grep -o '<button[^>]*submitButton[^>]*>' "$contact" | grep -q disabled; then
            echo "  Submit:     disabled"
          else
            echo "  Submit:     enabled"
          fi
          echo "== Landing page =="
          # Marker string from content/landing-page-v2.json, the built-in
          # fallback served whenever the Sanity config is incomplete.
          if grep -q "Transform Your Business with MYReSolve" "$home"; then
            echo "  Content:    built-in fallback (Sanity NOT in use)"
          else
            echo "  Content:    fetched from Sanity"
          fi
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
