name: Deploy booking Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "workers/booking/**"
      - ".github/workflows/deploy-booking.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-booking
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # The Worker has no dependencies to install and no build step: wrangler
      # uploads src/index.mjs directly. Run the same checks the repo uses so a
      # broken Worker is never uploaded.
      - name: Check and test the Worker
        run: |
          npm run booking:check
          npm run booking:test
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action installs 3.90.0 by default. That version does not
          # recognise "ratelimits", so it drops BOOKING_RATE_LIMITER silently
          # and the Worker then 503s on every request for want of the binding.
          # Pin a version that understands the config this Worker actually uses.
          wranglerVersion: "4.129.0"
          # Name the config explicitly rather than relying on the working
          # directory: left to discover one, wrangler walked up to the site's
          # root wrangler.toml and tried to deploy that instead.
          command: deploy --config workers/booking/wrangler.jsonc
          # This never sets or reads Worker secrets: NOTION_TOKEN,
          # TURNSTILE_SECRET_KEY, RESEND_API_KEY, RESEND_FROM_EMAIL and
          # RESEND_REPLY_TO stay exactly as configured in Cloudflare.
